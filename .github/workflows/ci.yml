name: CI

on:
  # Deliberately narrow: all-branch pushes fire a second full run on every PR commit.
  # Concurrency does not safely solve that because push and PR refs differ.
  # Regression signal: two runs with one head SHA, one push and one pull_request.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Tag runs publish a release and must never be cancelled by a newer push; the group is
  # already per-ref, so excluding them here costs nothing on branch or PR runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  skills:
    name: Skill validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The pull_request changed-path filter below diffs against the base SHA.
          fetch-depth: 0

      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true

      # scaffold-frontend's verifiers resolve real package metadata through npm. The
      # runner image ships npm 10, whose arborist dies with "Cannot read properties of
      # null (reading 'edgesOut')" (npm/cli#9787) on their fixture's peer set --
      # verify-version-floor.ps1 SKIPs on it by design and verify-template-contract.ps1
      # fails outright, so the job has been red on an environment bug rather than on a
      # contract breach. Both verifiers' comments already assume "CI pins npm 12";
      # nothing ever did. This is that pin.
      - name: Pin npm past the arborist peer-set crash
        run: npm install -g npm@12

      - name: Run skill verification scripts
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $verifiers = @(
            Get-ChildItem skills -Recurse -Filter 'verify-*.ps1' |
              Where-Object Name -ne 'verify-collect.ps1' |
              Sort-Object FullName
          )
          # verify-collect.ps1 is an estate integration skeleton with intentional
          # <repos-root> placeholders; it cannot run in this standalone public repo.

          # On a pull request, run only the verifiers of the skills the PR touched. Any
          # change outside skills/ (.github, .claude, root files) can alter how every
          # verifier runs, so it widens the run back to everything — as do push and
          # dispatch events, and any failure to compute the diff.
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and $env:BASE_SHA) {
            $changed = @(& git diff --name-only "$env:BASE_SHA...HEAD")
            if ($LASTEXITCODE -eq 0 -and $changed.Count -gt 0 -and
                -not ($changed | Where-Object { $_ -notlike 'skills/*' })) {
              # A file directly under skills/ (skills/foo.md) belongs to no skill;
              # treating 'foo.md' as a skill name would silently exclude every verifier,
              # so a loose file widens the run instead of narrowing it.
              $touched = @()
              $loose = $false
              foreach ($path in $changed) {
                $segments = $path -split '/'
                if ($segments.Count -lt 3) { $loose = $true; break }
                $touched += $segments[1]
              }
              if ($loose) {
                Write-Host 'Changed files sit directly under skills/ and belong to no skill; running every verifier.'
              }
              else {
                $touched = @($touched | Sort-Object -Unique)
                # Verifiers that read sibling skills must also run when a sibling they
                # read changes, or the sibling's edit merges without its contract being
                # checked. Verifier path (repo-relative) -> the additional skills that
                # trigger it. Add an entry when a verifier gains a cross-skill read.
                $crossSkill = @{
                  'skills/audit-ci/test/verify-blacksmith-guidance.ps1' = @('scaffold-ci')
                  'skills/audit-tests/test/verify-policy.ps1' = @('scaffold-tests')
                  'skills/review-sweep/test/verify-runtime-neutral.ps1' = @('adversarial-review')
                  'skills/scaffold-ci/test/verify-security-visibility-policy.ps1' = @(
                    'audit-ci', 'audit-github-estate', 'quality-gate-review', 'scaffold-dotnet')
                }
                $selected = @($verifiers | Where-Object {
                    $rel = $_.FullName.Substring($PWD.Path.Length + 1) -replace '\\', '/'
                    $extra = $crossSkill[$rel]
                    ($touched -contains ($rel -split '/')[1]) -or
                      ($null -ne $extra -and
                       @($extra | Where-Object { $touched -contains $_ }).Count -gt 0)
                  })
                if ($selected.Count -gt 0) {
                  Write-Host "Changed-path filter: $($selected.Count) of $($verifiers.Count) verifiers, for skills: $($touched -join ', ')"
                  $verifiers = $selected
                }
                else {
                  Write-Host 'Changed-path filter selected nothing; running every verifier instead.'
                }
              }
            }
            else {
              Write-Host 'Change set reaches outside skills/ (or is unreadable); running every verifier.'
            }
          }

          $failed = @()
          $skipped = 0
          $passed = 0
          foreach ($verifier in $verifiers) {
            Write-Host "Running $($verifier.FullName)"
            # Run each verifier in its own process. A successful verifier may inspect a
            # deliberately failing child; its child's native status must not be mistaken
            # for the verifier's process exit code by this shared harness.
            $threw = $null
            $output = $null
            try {
              $output = & pwsh -NoProfile -File $verifier.FullName *>&1 | Out-String
            }
            catch {
              $threw = $_
            }
            if ($output) { Write-Host $output }
            # A WHOLE-verifier skip is not a pass: a verifier whose output is only
            # `SKIP: <reason>` lines verified nothing and is counted as skipped, so an
            # all-skip run fails the guard below. A PARTIAL skip (SKIP lines alongside
            # real assertion output) still verified something and counts as passed —
            # classifying it as skipped would let a lone partial-skip verifier fail the
            # all-skip guard on a run that did verify.
            $skipLines = ([regex]::Matches("$output", '(?m)^SKIP:')).Count
            $substantiveLines = @("$output" -split '\r?\n' | Where-Object { $_.Trim() -and $_ -notmatch '^\s*SKIP:' }).Count
            $exitCode = $global:LASTEXITCODE
            if ($threw) {
              $failed += "$($verifier.FullName) (threw: $threw)"
            }
            elseif ($null -ne $exitCode -and $exitCode -ne 0) {
              $failed += "$($verifier.FullName) (exit code $exitCode)"
            }
            elseif ($skipLines -gt 0 -and $substantiveLines -eq 0) {
              $skipped++
            }
            else {
              $passed++
            }
          }

          Write-Host "Verifier summary: $passed passed, $skipped skipped, $($failed.Count) failed, of $($verifiers.Count) run."
          # Skipped verifiers never reach $passed, so an all-skip run has $passed -eq 0:
          # a run that verified nothing is not green.
          if ($verifiers.Count -gt 0 -and $passed -eq 0 -and $failed.Count -eq 0) {
            Write-Host 'Every verifier skipped — a run that verifies nothing is not a pass.'
            exit 1
          }
          if ($failed) {
            Write-Host 'Failed verifiers:'
            $failed | ForEach-Object { Write-Host "  $_" }
            exit 1
          }

  gate-coverage:
    name: Gate coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert every job in this workflow is gated
        env:
          GATE_EXEMPT: ''
        run: python3 .github/scripts/assert_gate_coverage.py .github/workflows/ci.yml

  sanitisation:
    name: No private tokens
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert tracked files carry no machine paths, org wiring, or real endpoints
        run: python3 .github/scripts/assert_no_private_tokens.py

  # Required status check. Deliberately a pure aggregator of needs.*.result: it decides
  # what can merge, so it has no checkout, no parser and no network of its own.
  #
  # `if: always()` is load-bearing. Without it the job is SKIPPED when an upstream job
  # fails, a skipped job emits no check run at all, and a required context that never
  # reports leaves the pull request permanently unmergeable.
  #
  # `skipped` counts as a pass, which is what lets job-level `if:` conditions and path
  # filtering work; `failure` and `cancelled` do not.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [skills, gate-coverage, sanitisation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any upstream job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
        run: |
          echo "Upstream results: $RESULTS"
          exit 1
