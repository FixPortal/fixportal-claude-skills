# Weekly full-history secret sweep. Copy into a PRIVATE repository as
# .github/workflows/secret-sweep.yml and change the cron to a repository-specific
# weekday and time - do not copy this cron value across the estate.
#
# trufflehog verifies each candidate by calling the issuing provider's API, so a
# finding here is a credential that works right now. That verification sends
# suspected secrets out of this repository to the provider that issued them.
name: secret-sweep

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 2'

concurrency:
  group: secret-sweep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sweep:
    name: Verified secret sweep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only verified results. An unverified finding is a string that looks like a
      # secret; a verified one is a credential that currently works. Reporting both
      # is how a scanner becomes noise that nobody reads.
      #
      # Detectors are an allowlist, not the default set. Verification is implemented
      # independently by each detector, so include only providers the estate could
      # plausibly use. An unknown detector name fails the run. Add one only when the
      # provider is adopted and the detector has been reviewed.
      - name: Scan full history for live credentials
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          # Pinned twice: the action is SHA-pinned above, and its scanner image is
          # pinned by digest here (manifest list covering linux/amd64 + arm64).
          # `version` defaults to `latest`, and a bare tag can be re-pushed — the tool
          # that decides what counts as a live credential must not change without a
          # commit. Bump the tag and digest together.
          version: 3.96.0@sha256:aa821cf4ace8861c7d096d83818cdf7bb9719028a52d37a52eaad44086a52577
          extra_args: >-
            --results=verified
            --include-detectors=AWS,AWSSessionKey,Azure,AzureStorage,AzureSQL,AzureSasToken,AzureActiveDirectoryApplicationSecret,AzureContainerRegistry,AzureOpenAI,Github,GitHubApp,GitHubOauth2,OpenAI,Anthropic,NpmToken,Postgres,Dockerhub
